name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen cocoapods

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install MediaPipe pod
        run: pod install

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace ShouQiao.xcworkspace \
            -scheme ShouQiao \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShouQiao.app Payload/
          zip -r ShouQiao-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShouQiao-unsigned-ipa
          path: ShouQiao-unsigned.ipa
          if-no-files-found: error
